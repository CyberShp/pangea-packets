name: Windows portable
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - run: npm ci
      - run: npm run build
      - run: python -m pip install -r backend/requirements.txt pyinstaller==6.16.0 httpx==0.28.1
      - name: Backend regression
        env:
          PYTHONPATH: backend
        run: python -m unittest discover -s backend/tests -v
      - name: Package
        run: python -m PyInstaller --noconfirm --clean --distpath release packaging/windows.spec
      - name: Test packaged executable
        run: python scripts/smoke_portable.py release/Pangea/Pangea.exe
      - name: Assemble portable archive
        shell: pwsh
        run: |
          Copy-Item docs/WINDOWS_PORTABLE.md release/Pangea/README.md
          python -m pip freeze | Out-File -Encoding utf8 release/Pangea/build-dependencies.txt
          git rev-parse HEAD | Out-File -Encoding utf8 release/Pangea/build-commit.txt
          Compress-Archive -Path release/Pangea -DestinationPath release/Pangea-windows-x64.zip
          (Get-FileHash release/Pangea-windows-x64.zip -Algorithm SHA256).Hash + '  Pangea-windows-x64.zip' | Out-File -Encoding ascii release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Pangea-windows-x64
          path: |
            release/Pangea-windows-x64.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
